name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test & Drift Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check OpenAPI Specification Drift
        run: npx tsx scripts/generate-openapi-file.ts --check

      - name: Run OpenAPI Drift Tests
        run: npx tsx --test scripts/tests/checkOpenApiDrift.test.ts

