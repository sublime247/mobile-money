name: SSL Certificate Renewal

on:
  schedule:
    # Twice daily – catches certificates expiring soon and supports Let's Encrypt
    # 30-day renewal window with jitter avoidance
    - cron: "0 3 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      threshold_days:
        description: "Days before expiry to trigger renewal"
        required: false
        default: "30"
        type: string
      domains:
        description: "Comma-separated domains to check (overrides config file)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry run – check only, do not attempt renewal"
        required: false
        default: false
        type: boolean
      force_renew:
        description: "Force renewal regardless of expiry"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "config/cert_domains.json"
      - "config/ssl-renewal.json"
      - "scripts/cert_check.ts"
      - "scripts/ssl-renew.ts"
      - ".github/workflows/ssl-renewal.yml"
  pull_request:
    paths:
      - "config/cert_domains.json"
      - "config/ssl-renewal.json"
      - "scripts/cert_check.ts"
      - "scripts/ssl-renew.ts"
      - ".github/workflows/ssl-renewal.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write
  security-events: write

concurrency:
  group: ssl-renewal-${{ github.ref }}
  cancel-in-progress: false

env:
  DEFAULT_THRESHOLD: "30"
  CERT_CHECK_DOMAINS_CONFIG: "config/cert_domains.json"
  SSL_RENEWAL_CONFIG: "config/ssl-renewal.json"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1) Certificate expiry check – gates the renewal step
  # ──────────────────────────────────────────────────────────────────────────
  check:
    name: Check certificate expiry
    runs-on: ubuntu-latest
    outputs:
      needs_renewal: ${{ steps.evaluate.outputs.needs_renewal }}
      expiring_domains: ${{ steps.evaluate.outputs.expiring_domains }}
      threshold: ${{ steps.evaluate.outputs.threshold }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies (no scripts)
        run: npm ci --ignore-scripts

      - name: Resolve threshold and domains
        id: resolve
        run: |
          THRESHOLD="${{ inputs.threshold_days }}"
          if [ -z "$THRESHOLD" ]; then
            THRESHOLD="${{ env.DEFAULT_THRESHOLD }}"
          fi
          # Allow env override for scheduled runs
          if [ -n "$CERT_CHECK_THRESHOLD" ]; then
            THRESHOLD="$CERT_CHECK_THRESHOLD"
          fi
          echo "threshold=$THRESHOLD" >> "$GITHUB_OUTPUT"
          DOMAINS_INPUT="${{ inputs.domains }}"
          if [ -n "$DOMAINS_INPUT" ]; then
            echo "domains=$DOMAINS_INPUT" >> "$GITHUB_OUTPUT"
          elif [ -n "$CERT_CHECK_DOMAINS" ]; then
            echo "domains=$CERT_CHECK_DOMAINS" >> "$GITHUB_OUTPUT"
          else
            echo "domains=" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved threshold=$THRESHOLD domains=${DOMAINS_INPUT:-<config>}"

      - name: Run certificate expiry check (JSON)
        id: cert_check
        run: |
          THRESHOLD="${{ steps.resolve.outputs.threshold }}"
          DOMAINS="${{ steps.resolve.outputs.domains }}"
          ARGS=(--threshold "$THRESHOLD" --json)
          if [ -n "$DOMAINS" ]; then
            ARGS+=(--domains "$DOMAINS")
          fi
          set +e
          npm run check-cert -- "${ARGS[@]}" 2>&1 | tee cert-check-output.json
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          # Persist for evaluate step even on failure (expiring certs exit 1)
          exit 0
        continue-on-error: true

      - name: Evaluate renewal requirement
        id: evaluate
        run: |
          THRESHOLD="${{ steps.resolve.outputs.threshold }}"
          echo "threshold=$THRESHOLD" >> "$GITHUB_OUTPUT"

          # The checker exits with code 1 when renewal attention is required.
          if [ "${{ steps.cert_check.outputs.exit_code }}" = "1" ]; then
            echo "needs_renewal=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_renewal=false" >> "$GITHUB_OUTPUT"
          fi
          echo "expiring_domains=${{ steps.resolve.outputs.domains }}" >> "$GITHUB_OUTPUT"

          # Force flag overrides evaluation
          if [ "${{ inputs.force_renew }}" = "true" ]; then
            echo "needs_renewal=true" >> "$GITHUB_OUTPUT"
            echo "Forced renewal requested – overriding check result"
          fi

          echo "Renewal needed: $(cat $GITHUB_OUTPUT | grep needs_renewal)"

      - name: Upload check artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cert-check-output
          path: cert-check-output.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "### 🔒 Certificate Check Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Threshold: ${{ steps.resolve.outputs.threshold }} days" >> "$GITHUB_STEP_SUMMARY"
          echo "- Needs renewal: ${{ steps.evaluate.outputs.needs_renewal }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Expiring domains: \`${{ steps.evaluate.outputs.expiring_domains || 'none' }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────────
  # 2) Automatic renewal – Let's Encrypt via certbot / ACME
  #    Runs only when certificates are within renewal window or forced.
  # ──────────────────────────────────────────────────────────────────────────
  renew:
    name: Automatic renewal
    runs-on: ubuntu-latest
    needs: check
    # Renew if needed, forced, or manually dispatched with dry_run false; skip on PRs unless forced
    if: |
      always() &&
      (needs.check.outputs.needs_renewal == 'true' || inputs.force_renew == 'true') &&
      (github.event_name != 'pull_request' || inputs.force_renew == 'true')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Load renewal config
        id: config
        run: |
          CONFIG_FILE="config/ssl-renewal.json"
          if [ -f "$CONFIG_FILE" ]; then
            echo "Found $CONFIG_FILE"
            cat "$CONFIG_FILE"
            # Extract ACME email and provider for logging (not secrets)
            ACME_EMAIL=$(node -p "try{require('./$CONFIG_FILE').acme.email||''}catch(e){''}")
            echo "acme_email=$ACME_EMAIL" >> "$GITHUB_OUTPUT"
          else
            echo "No $CONFIG_FILE – using defaults"
          fi

      - name: Determine renewal mode
        id: mode
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=auto" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.force_renew }}" = "true" ]; then
            echo "mode=force" >> "$GITHUB_OUTPUT"
          else
            echo "mode=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Install certbot (Let's Encrypt)
        if: steps.mode.outputs.mode != 'dry-run'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y certbot python3-certbot-nginx 2>&1 | tail -n 20
          certbot --version

      - name: Validate ACME and DNS prerequisites
        run: |
          node -e "
            const fs=require('fs');
            const cfgPath='config/ssl-renewal.json';
            let cfg={};
            if(fs.existsSync(cfgPath)) cfg=JSON.parse(fs.readFileSync(cfgPath,'utf8'));
            console.log('Renewal config:', JSON.stringify(cfg, null, 2));
            const required = cfg.acme && cfg.acme.email;
            if(!required) console.log('::warning:: ACME email not configured – set config/ssl-renewal.json acme.email');
          "

      - name: Execute renewal workflow (ACM/DNS-01 or HTTP-01)
        id: renew
        env:
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          AWS_ROUTE53_ACCESS_KEY: ${{ secrets.AWS_ROUTE53_ACCESS_KEY }}
          AWS_ROUTE53_SECRET_KEY: ${{ secrets.AWS_ROUTE53_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CERT_THRESHOLD: ${{ needs.check.outputs.threshold }}
          EXPIRING_DOMAINS: ${{ needs.check.outputs.expiring_domains }}
          RENEW_MODE: ${{ steps.mode.outputs.mode }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          # Build args for ssl-renew script
          ARGS=()
          if [ -n "$CERT_THRESHOLD" ]; then ARGS+=(--threshold "$CERT_THRESHOLD"); fi
          if [ -n "$EXPIRING_DOMAINS" ]; then ARGS+=(--domains "$EXPIRING_DOMAINS"); fi
          if [ "$RENEW_MODE" = "dry-run" ]; then ARGS+=(--dry-run); fi
          if [ "${{ inputs.force_renew }}" = "true" ]; then ARGS+=(--force); fi

          echo "Running: npx tsx scripts/ssl-renew.ts -- ${ARGS[*]}"

          # 1) Node-based renewal planner (validates configuration and dry-run safety)
          if npx tsx scripts/ssl-renew.ts "${ARGS[@]}"; then
            echo "renewal_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "renewal_status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # 2) If certbot is requested and secrets allow DNS-01, attempt certbot renewal
          #    Guard: only on main branch with provider credentials configured
          if [ "$RENEW_MODE" != "dry-run" ] && [ -n "${ACME_EMAIL:-}" ]; then
            echo "Attempting certbot renewal (if applicable)..."
            # Example HTTP-01 dry-run command (commented for CI safety without real domain/routing):
            # certbot renew --dry-run --non-interactive --agree-tos -m "$ACME_EMAIL" || true
            # For DNS-01 via Route53:
            # certbot certonly --dns-route53 -d "<domain>" --non-interactive --agree-tos -m "$ACME_EMAIL" || true
            echo "Certbot step skipped in CI without live DNS – see terraform/modules/acm for production ACM auto-renewal"
          fi

      - name: Verify post-renewal certificates
        if: always() && steps.renew.outputs.renewal_status == 'success'
        run: |
          THRESHOLD="${{ needs.check.outputs.threshold }}"
          # Re-run expiry check to confirm renewal pushed expiry beyond threshold
          npm run check-cert -- --threshold "$THRESHOLD" || echo "::warning:: Post-renewal verification indicates certs still expiring – manual intervention may be needed"

      - name: Commit renewal metadata (if changed)
        if: steps.renew.outputs.renewal_status == 'success' && steps.mode.outputs.mode != 'dry-run'
        run: |
          # The ssl-renew script may update config/ssl-renewal.json lastRenewal or certs/
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(ssl): automatic certificate renewal metadata [skip ci]" || echo "No changes to commit"
            # Push only on scheduled/workflow_dispatch runs on default branch
            if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
              git push || echo "::warning:: Push failed – may need to rebase"
            else
              echo "Skipping push outside main branch"
            fi
          else
            echo "No renewal metadata changes to commit"
          fi

      - name: Upload renewal logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssl-renewal-logs
          path: |
            logs/ssl-renewal*.log
            cert-check-output.json
          retention-days: 30
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────────
  # 3) Failure notification – GitHub Issue + Slack
  # ──────────────────────────────────────────────────────────────────────────
  notify-failure:
    name: Notify renewal failure
    runs-on: ubuntu-latest
    needs: [check, renew]
    if: |
      always() &&
      (needs.renew.result == 'failure' || (needs.check.outputs.needs_renewal == 'true' && needs.renew.result == 'skipped' && github.event_name == 'schedule'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Issue on renewal failure
        uses: actions/github-script@v7
        with:
          script: |
            const expiring = '${{ needs.check.outputs.expiring_domains }}' || 'unknown';
            const threshold = '${{ needs.check.outputs.threshold }}' || '30';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `🚨 SSL certificate renewal failed – ${expiring} expiring within ${threshold} days`;
            const body = [
              `Automatic SSL renewal workflow failed on \`${new Date().toISOString()}\`.`,
              ``,
              `- **Workflow run:** ${runUrl}`,
              `- **Threshold:** ${threshold} days`,
              `- **Expiring domains:** \`${expiring || 'unknown (see logs)'}\``,
              `- **Trigger:** \`${context.eventName}\``,
              ``,
              `### Next steps`,
              `- [ ] Verify DNS / ACME challenge configuration (\`config/ssl-renewal.json\`)`,
              `- [ ] Check Terraform ACM module (\`terraform/modules/acm\`) auto-renewal status`,
              `- [ ] For Kubernetes, verify cert-manager \`Certificate\` and \`Issuer\` in \`k8s/\``,
              `- [ ] Re-run workflow with \`force_renew: true\` after fixing root cause`,
              ``,
              `> Auto-generated by \`.github/workflows/ssl-renewal.yml\`. Review logs artifact for details.`,
            ].join('\n');

            // Avoid duplicate open issues – check existing
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ssl,security,devops',
              per_page: 20,
            });
            const duplicate = existing.data.find(i => i.title.includes('SSL certificate renewal failed'));
            if (duplicate) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body: `Re-occurrence at ${new Date().toISOString()} – [workflow run](${runUrl}) still failing for \`${expiring}\`.`,
              });
              console.log(`Updated existing issue #${duplicate.number}`);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ssl', 'security', 'devops'],
              });
              console.log(`Created issue #${issue.data.number}`);
            }

      - name: Notify Slack on failure
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          payload=$(jq -n \
            --arg text "🚨 SSL Certificate Renewal Failed" \
            --arg expiring "${{ needs.check.outputs.expiring_domains }}" \
            --arg threshold "${{ needs.check.outputs.threshold }}" \
            --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.runId }}" \
            '{
              text: $text,
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: "*:rotating_light: SSL Certificate Renewal Failed*\n*Expiring:* `\($expiring)`\n*Threshold:* \($threshold) days\n*Run:* <\($run_url)|View workflow>" } }
              ]
            }')
          curl -fsSL -X POST -H "Content-type: application/json" --data "$payload" "$SLACK_WEBHOOK_URL" || echo "::warning:: Slack webhook failed"

  # ──────────────────────────────────────────────────────────────────────────
  # 4) Success notification (optional, low noise)
  # ──────────────────────────────────────────────────────────────────────────
  notify-success:
    name: Notify renewal success
    runs-on: ubuntu-latest
    needs: [check, renew]
    if: needs.renew.result == 'success'
    steps:
      - name: Slack success notification (if configured)
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          payload=$(jq -n \
            --arg expiring "${{ needs.check.outputs.expiring_domains }}" \
            --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.runId }}" \
            '{
              text: "✅ SSL certificates renewed successfully",
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: "*:white_check_mark: SSL Renewal Succeeded*\n*Domains:* `\($expiring)`\n*Run:* <\($run_url)|View workflow>" } }
              ]
            }')
          curl -fsSL -X POST -H "Content-type: application/json" --data "$payload" "$SLACK_WEBHOOK_URL" || echo "Slack notify failed (optional)"

  # ──────────────────────────────────────────────────────────────────────────
  # 5) Reload / redeploy dependents – nginx, app pods (via workflow_call)
  #    Triggered after successful renewal to hot-reload TLS.
  # ──────────────────────────────────────────────────────────────────────────
  reload:
    name: Reload dependents
    runs-on: ubuntu-latest
    needs: [check, renew]
    if: needs.renew.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger dependent redeploy marker
        run: |
          echo "Renewal succeeded – dependents should reload TLS."
          echo "For ECS/ALB: ACM auto-renewal handles attachment – no pod restart required."
          echo "For K8s/nginx: cert-manager will update Secret; deployment will roll automatically."
          echo "For docker-compose nginx: run 'docker compose exec load-balancer nginx -s reload' after cert update."
          # Create marker artifact for observability
          mkdir -p logs
          echo "{\"renewed_at\":\"$(date -u +%FT%TZ)\",\"domains\":\"${{ needs.check.outputs.expiring_domains }}\",\"threshold\":${{ needs.check.outputs.threshold || 30}} }" > logs/ssl-renewal.marker.json
          cat logs/ssl-renewal.marker.json

      - name: Upload reload marker
        uses: actions/upload-artifact@v4
        with:
          name: ssl-reload-marker
          path: logs/ssl-renewal.marker.json
          retention-days: 7
