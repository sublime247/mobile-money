name: Docker Image Vulnerability Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  trivy-scan:
    name: Build image and scan with Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU and Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t mobile-money:${{ github.sha }} -f Dockerfile .

      - name: Run Trivy vulnerability scan (JSON artifact)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: mobile-money:${{ github.sha }}
          format: json
          output: trivy-report.json
          exit-code: "0"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          severity: CRITICAL,HIGH

      - name: Upload Trivy report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json

      - name: Run Trivy vulnerability scan (SARIF for Security tab)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mobile-money:${{ github.sha }}
          format: sarif
          output: trivy-image-results.sarif
          exit-code: "0"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF report to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Fail build on High/Critical container vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mobile-money:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          severity: CRITICAL,HIGH
